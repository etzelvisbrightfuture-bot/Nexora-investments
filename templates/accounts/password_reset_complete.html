{% extends 'base.html' %}
{% block title %}Password Changed - Nexora Capital Groups{% endblock %}
{% block content %}
<div class="container" style="max-width: 500px; margin: 80px auto; padding: 40px; background: white; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); text-align: center;">
    <div style="font-size: 3rem; margin-bottom: 20px;">✅</div>
    <h2 style="color: #1e3a5f; margin-bottom: 15px;">Password Reset Complete</h2>
    <p style="color: #64748b; line-height: 1.6; margin-bottom: 30px;">
        Your password has been successfully changed. You can now log in with your new password.
    </p>
    <a href="{% url 'login' %}" class="btn-primary" style="display: inline-block; padding: 12px 30px; background: #667eea; color: white; text-decoration: none; border-radius: 8px; font-weight: 600;">Log In Now</a>
</div>
{% endblock %}
