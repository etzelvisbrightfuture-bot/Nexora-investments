{% extends 'base.html' %}
{% block title %}Reset Password - Nexora Capital Groups{% endblock %}
{% block content %}
<div class="container" style="max-width: 500px; margin: 80px auto; padding: 40px; background: white; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.1);">
    <h2 style="color: #1e3a5f; text-align: center; margin-bottom: 10px;">Reset Your Password</h2>
    <p style="color: #64748b; text-align: center; margin-bottom: 30px; font-size: 0.95rem;">
        Enter the email address associated with your account, and we'll send you a link to reset your password.
    </p>
    <form method="POST">
        {% csrf_token %}
        <div style="margin-bottom: 20px;">
            <label style="display: block; color: #1e3a5f; font-weight: 600; margin-bottom: 8px;">Email Address</label>
            <input type="email" name="email" required class="form-control" style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem;" placeholder="you@example.com">
        </div>
        <button type="submit" class="btn-primary" style="width: 100%; padding: 14px; background: #667eea; color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer;">Send Reset Link</button>
    </form>
    <p style="text-align: center; margin-top: 20px;">
        <a href="{% url 'login' %}" style="color: #667eea; text-decoration: none;">&larr; Back to Login</a>
    </p>
</div>
{% endblock %}
